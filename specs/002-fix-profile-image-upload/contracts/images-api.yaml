openapi: 3.0.3
info:
  title: Profile Images API
  description: API endpoints for uploading and retrieving user profile images
  version: 1.0.0

servers:
  - url: https://api.example.com
    description: Production API

paths:
  /images/:
    get:
      summary: Get user profile images
      description: Retrieve all profile images for the authenticated user
      operationId: getUserImages
      tags:
        - Images
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved user images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetImagesResponse'
              examples:
                withImages:
                  value:
                    success: true
                    images:
                      - https://storage.example.com/profile/user123_1234567890_abc123.jpg
                      - https://storage.example.com/profile/user123_1234567891_def456.jpg
                    total_images: 2
                noImages:
                  value:
                    success: true
                    images: []
                    total_images: 0
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /images/upload:
    post:
      summary: Upload profile images
      description: Upload multiple images to user profile (max 6 per user, 5MB per file)
      operationId: uploadImages
      tags:
        - Images
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of image files (JPEG, JPG, PNG, WEBP)
                  maxItems: 6
            encoding:
              files:
                contentType: image/jpeg, image/jpg, image/png, image/webp
      responses:
        '200':
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadImagesResponse'
              examples:
                success:
                  value:
                    success: true
                    message: "2 images uploaded successfully"
                    image_urls:
                      - https://storage.example.com/profile/user123_1234567890_abc123.jpg
                      - https://storage.example.com/profile/user123_1234567891_def456.jpg
                    total_uploaded: 2
                    user_total_images: 2
                partialSuccess:
                  value:
                    success: true
                    message: "1 image uploaded, 1 failed validation"
                    image_urls:
                      - https://storage.example.com/profile/user123_1234567890_abc123.jpg
                    total_uploaded: 1
                    user_total_images: 1
        '400':
          description: Bad request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noFiles:
                  value:
                    success: false
                    message: "No files provided"
                tooManyFiles:
                  value:
                    success: false
                    message: "Maximum 6 images allowed per user"
                invalidFileType:
                  value:
                    success: false
                    message: "Invalid file type. Only JPEG, JPG, PNG, WEBP allowed"
                fileTooLarge:
                  value:
                    success: false
                    message: "File size exceeds 5MB limit"
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication endpoint

  schemas:
    GetImagesResponse:
      type: object
      required:
        - success
        - images
        - total_images
      properties:
        success:
          type: boolean
          description: Whether the request succeeded
        images:
          type: array
          items:
            type: string
            format: uri
            description: Public URL of uploaded image
          description: Array of image URLs (empty if no images)
        total_images:
          type: integer
          minimum: 0
          maximum: 6
          description: Total count of user's images

    UploadImagesResponse:
      type: object
      required:
        - success
        - message
        - image_urls
        - total_uploaded
        - user_total_images
      properties:
        success:
          type: boolean
          description: Whether upload succeeded
        message:
          type: string
          description: Human-readable status message
        image_urls:
          type: array
          items:
            type: string
            format: uri
            description: Public URL of uploaded image
          description: Array of successfully uploaded image URLs (MUST be present if success=true)
        total_uploaded:
          type: integer
          minimum: 0
          maximum: 6
          description: Count of successfully uploaded images
        user_total_images:
          type: integer
          minimum: 0
          maximum: 6
          description: Total images user has after upload

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Error message describing what went wrong

